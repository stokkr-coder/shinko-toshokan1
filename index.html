<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#241a12">
<title>Shinko Toshokan</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

  <div id="splash">
    <div id="splashConteudo">
      <div id="splashIcone">🕮</div>
      <div id="splashTitulo">Shinko Toshokan</div>
      <div id="splashSub">sua estante pessoal</div>
    </div>
  </div>

  <header>
    <h1>Shinko Toshokan</h1>
    <p class="subtitulo" id="contagem">carregando acervo...</p>
  </header>

  <div id="metaLeitura" class="meta-leitura" style="display:none;">
    <div class="meta-topo">
      <span id="metaTexto"></span>
      <span id="metaPorcentagem"></span>
    </div>
    <div class="meta-barra"><div id="metaBarraPreenchida" class="meta-barra-preenchida"></div></div>
  </div>

  <div class="filtros">
    <input type="text" id="busca" placeholder="Buscar por título, autor, série ou ID...">
    <div class="chips" id="chipsStatus"></div>
    <div class="chips" id="chipsMidia"></div>
  </div>

  <div class="estante-parede">
    <div id="estante" class="estante-grade"></div>
    <div id="vazio" class="vazio" style="display:none;">Nenhum item encontrado nessa prateleira.</div>
  </div>

  <div id="modalOverlay" class="modal-overlay" style="display:none;">
    <div class="modal-cartao">
      <button id="modalFechar" class="modal-fechar" aria-label="Fechar">✕</button>
      <div id="modalCapaWrap" class="modal-capa-wrap"></div>
      <div class="modal-corpo">
        <p id="modalSerie" class="modal-serie"></p>
        <h2 id="modalTitulo" class="modal-titulo"></h2>
        <p id="modalAutor" class="modal-autor"></p>
        <div id="modalEstrelas" class="modal-estrelas"></div>
        <div class="modal-meta">
          <span id="modalStatus" class="status-tag-texto"></span>
          <span id="modalMidia"></span>
          <span id="modalId" class="modal-id"></span>
        </div>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
