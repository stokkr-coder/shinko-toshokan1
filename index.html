<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#1e3f5c">
<title>Shinko Toshokan</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="stylesheet" href="style.css">
</head>
<body>

  <div id="splash">
    <div id="splashConteudo">
      <div id="splashIcone">📚</div>
      <div id="splashTitulo">Shinko Toshokan</div>
      <div id="splashSub">seu acervo pessoal</div>
    </div>
  </div>

  <header>
    <h1>📚 Shinko Toshokan</h1>
    <p class="subtitulo" id="contagem">carregando acervo...</p>
  </header>

  <div id="metaLeitura" class="meta-leitura" style="display:none;">
    <div class="meta-topo">
      <span id="metaTexto"></span>
      <span id="metaPorcentagem"></span>
    </div>
    <div class="meta-barra"><div id="metaBarraPreenchida" class="meta-barra-preenchida"></div></div>
  </div>

  <div class="filtros">
    <input type="text" id="busca" placeholder="Buscar por título, autor, série ou ID...">
    <div class="chips" id="chipsStatus"></div>
    <div class="chips" id="chipsMidia"></div>
  </div>

  <main id="lista"></main>

  <div id="vazio" class="vazio" style="display:none;">Nenhum item encontrado.</div>

  <script src="app.js"></script>
</body>
</html>
